name: Keep Render instance awake

on:
  schedule:
    # Every 10 minutes — comfortably under Render's 15-minute idle timeout.
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          curl -sf --max-time 30 "${{ secrets.RENDER_URL }}/" || echo "Ping failed (likely a cold start) — next scheduled ping will retry."
